version: '3.8'

services:
  # 1. PostgreSQL Database with Persistent Volume
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reachinbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reachinbox_secret}
      POSTGRES_DB: ${POSTGRES_DB:-reachinbox_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/models/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-reachinbox} -d ${POSTGRES_DB:-reachinbox_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Persistent Job Store for BullMQ Delayed Queues
  redis:
    image: redis:7-alpine
    container_name: reachinbox_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Elasticsearch Full-Text Search Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: reachinbox_elasticsearch
    restart: unless-stopped
    environment:
      - node.name=reachinbox-es
      - cluster.name=reachinbox-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cat/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
